# =============================================================
# Splunk Universal Forwarder - inputs.conf
# Target: Ubuntu 20.04 / 22.04 / 24.04 LTS
# Reference: Neo23x0 auditd, MITRE ATT&CK, Red Hat Security,
# ACSC, Splunk TA-linux_auditd
#
# CURATION PRINCIPLE
# Every input here earns its volume or it is disabled. Three tests
# were applied, in this order:
#
#   1. Is it duplicated somewhere else already collected?
#      Ubuntu's rsyslog routes kernel and cron messages into BOTH
#      their own files AND /var/log/syslog. Measured on a reference
#      host: 20/20 kern.log lines and 17/17 cron.log lines were
#      already present verbatim in syslog. Collecting both indexes
#      the same event twice and doubles its license cost for zero
#      extra signal. auth.log is the exception - rsyslog excludes
#      auth from syslog (auth,authpriv.none), 0/20 duplicated, so
#      it must be collected separately.
#
#   2. Does the path exist on a typical host of this role?
#      A monitor on a path that is not there consumes a TailReader
#      slot and a file descriptor and returns nothing.
#
#   3. Does the detection value justify the bytes?
#      auditd is ~70-85% of this file's volume and earns it. The web
#      server logs can exceed every security source combined and are
#      therefore opt-in per host. Enable-LinuxLogging-Ubuntu.sh carries
#      the matching ruleset rationale in its volume-tuning block.
#
# Re-enable anything your environment actually needs. Changing a
# disabled = true back to false is the whole edit.
# =============================================================


# ═════════════════════════════════════════════════════════════
#  TIER 1 - Collect everywhere, non-negotiable
# ═════════════════════════════════════════════════════════════

# ── auditd - Primary security telemetry source ────────────────
# The single highest-value source on the host: process execution,
# privilege escalation, persistence, anti-forensics, module loads.
# Typically 70-85% of this file's total volume, and worth it.
# REQUIRES: auditd installed + the pinned ruleset loaded, and the
# UF able to read the file (the script sets an ACL for this).

[monitor:///var/log/audit/audit.log]
disabled = false
sourcetype = linux_audit
index = linux
# Use Splunk Add-on for Linux Auditd (TA-linux_auditd) for CIM
# normalization: https://splunkbase.splunk.com/app/4232

# ── Authentication / PAM / SSH ────────────────────────────────
# Contains: SSH success/fail, sudo grants, su, PAM events,
# useradd/groupadd, session open/close
# Maps to: T1110, T1078, T1548.003, T1136
# NOT duplicated in syslog - rsyslog routes auth away from it.
# Low volume, extremely high value. Never cut this.

[monitor:///var/log/auth.log]
disabled = false
sourcetype = linux_secure
index = linux

# ── System / Daemon Messages ──────────────────────────────────
# The catch-all. On Ubuntu this ALREADY contains kernel and cron
# messages, which is why their dedicated files are disabled below.
# Also carries service start/stop, OOM kills, segfaults, and
# Sysmon for Linux output if it is installed.

[monitor:///var/log/syslog]
disabled = false
sourcetype = syslog
index = linux


# ═════════════════════════════════════════════════════════════
#  TIER 2 - Low volume, keep unless you have a reason not to
# ═════════════════════════════════════════════════════════════

# ── Package Management ────────────────────────────────────────
# Maps to: T1072 (software deployment tools), T1195 (supply chain)
# A few KB/day even on a busy host, and the record of what changed
# on the box. Keep both: history.log is the concise human-readable
# record, dpkg.log has the per-package state transitions.

[monitor:///var/log/dpkg.log]
disabled = false
sourcetype = dpkg
index = linux

[monitor:///var/log/apt/history.log]
disabled = false
sourcetype = dpkg
index = linux


# ═════════════════════════════════════════════════════════════
#  DISABLED - duplicated content
# ═════════════════════════════════════════════════════════════
# These are not low-value events. They are valuable events you are
# already collecting via /var/log/syslog. Enabling these pays for
# them a second time.
#
# If you enable either one, consider excluding that facility from
# syslog instead, so you still only pay once. In
# /etc/rsyslog.d/50-default.conf that means changing
#     *.*;auth,authpriv.none          -/var/log/syslog
# to
#     *.*;auth,authpriv.none;kern.none;cron.none  -/var/log/syslog
#
# NOTE ON SOURCETYPES: with these disabled, kernel and cron events
# arrive as sourcetype=syslog rather than linux_messages_syslog.
# Any saved search, dashboard or correlation rule keyed on the old
# sourcetype needs updating - the events are still there.

# ── Kernel Log ────────────────────────────────────────────────
# Contains: module loads/unloads, OOM killer, netfilter
# Maps to: T1547.006 (Kernel Modules)
# Measured 20/20 lines already present in syslog.
# Note that auditd also covers module loading directly
# (init_module / finit_module / delete_module), so this is in fact
# the third copy of that particular signal.

[monitor:///var/log/kern.log]
disabled = true
sourcetype = linux_messages_syslog
index = linux

# ── Cron (Scheduled Tasks) ────────────────────────────────────
# Maps to: T1053.003
# Measured 17/17 lines already present in syslog.
# Ubuntu does not create /var/log/cron.log by default - the
# directive ships commented out in 50-default.conf, precisely
# because cron already reaches syslog.

[monitor:///var/log/cron.log]
disabled = true
sourcetype = syslog
index = linux


# ═════════════════════════════════════════════════════════════
#  DISABLED - role-specific, enable per host
# ═════════════════════════════════════════════════════════════

# ── Web Server Logs ───────────────────────────────────────────
# Maps to: T1190 (exploit public-facing app), T1133
#
# Enable ONLY on hosts actually running the service. These are by
# far the highest-volume inputs in this file: a moderately busy web
# server can produce more access-log volume than every security
# source on every other host in the fleet combined. Budget for it
# before enabling, and consider whether error.log alone carries the
# security signal you need - access.log is mostly of forensic value
# after you already know something happened.

[monitor:///var/log/nginx/access.log]
disabled = true
sourcetype = web_access
index = linux

[monitor:///var/log/nginx/error.log]
disabled = true
sourcetype = web_error
index = linux

[monitor:///var/log/apache2/access.log]
disabled = true
sourcetype = web_access
index = linux

[monitor:///var/log/apache2/error.log]
disabled = true
sourcetype = web_error
index = linux


# ═════════════════════════════════════════════════════════════
#  DISABLED - cannot work from this file
# ═════════════════════════════════════════════════════════════

# ── Scripted inputs (via Splunk Add-on for Unix and Linux) ────
# TA-nix provides: CPU, disk, interfaces, lastlog, netstat,
# passwd, time, top, update, users, version, who
# Install TA-nix: https://splunkbase.splunk.com/app/833
#
# Leave this disabled HERE. A relative script path resolves against
# the directory of the app that owns the stanza; from
# $SPLUNK_HOME/etc/system/local/ that is the system context, which
# has no bin/, and Splunk additionally refuses scripted inputs
# outside an app's bin/ or $SPLUNK_HOME/bin/scripts/. Enabling it
# here logs this on every startup and collects nothing:
#
#   ERROR FrameworkUtils - Incorrect path to script:
#     .../etc/system/local/bin/lastlog.sh. Script must be located
#     inside $SPLUNK_HOME/bin/scripts.
#   ERROR ExecProcessor - Ignoring: ".../bin/lastlog.sh"
#
# The fix is not to correct the path. Install TA-nix, which ships
# this stanza inside its own app context along with the script it
# references, and enable what you want in
# $SPLUNK_HOME/etc/apps/Splunk_TA_nix/local/inputs.conf

[script://./bin/lastlog.sh]
disabled = true
sourcetype = lastlog
index = linux
interval = 3600
