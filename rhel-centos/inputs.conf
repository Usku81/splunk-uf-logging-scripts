# =============================================================
# Splunk Universal Forwarder - inputs.conf
# Target: RHEL 8/9 / CentOS 8 Stream
# Reference: Neo23x0 auditd, MITRE ATT&CK, Red Hat Security
# Guide, ACSC, Splunk TA-linux_auditd
#
# DIFFERENCES FROM UBUNTU — read before copying decisions across.
#   /var/log/secure     instead of auth.log
#   /var/log/messages   instead of syslog
#   /var/log/cron       instead of cron.log
#   no /var/log/kern.log at all — kernel messages land in messages
#   dnf.log / dnf.rpm.log instead of dpkg.log / apt history
#
# IMPORTANT: the Ubuntu config disables its kern.log and cron.log
# monitors because Ubuntu's rsyslog writes those events to BOTH
# their own file and syslog, so collecting both indexes them twice.
# That reasoning does NOT apply here. RHEL's default rule is:
#
#   *.info;mail.none;authpriv.none;cron.none   /var/log/messages
#   authpriv.*                                 /var/log/secure
#   cron.*                                     /var/log/cron
#
# The .none exclusions mean cron and authpriv are deliberately kept
# OUT of messages, so /var/log/cron and /var/log/secure are the only
# copy of those events. Both stay enabled. Do not "align" them with
# the Ubuntu file — you would lose cron and authentication logging
# outright.
#
# CURATION PRINCIPLE
# Every input earns its volume or it is disabled:
#   1. Is it already collected somewhere else? (see above — on RHEL
#      the answer is no, unlike Ubuntu)
#   2. Does the path exist on a typical host of this role?
#   3. Does the detection value justify the bytes?
# =============================================================


# ═════════════════════════════════════════════════════════════
#  TIER 1 - Collect everywhere, non-negotiable
# ═════════════════════════════════════════════════════════════

# ── auditd - Primary security telemetry source ────────────────
# The single highest-value source on the host: process execution,
# privilege escalation, persistence, anti-forensics, module loads.
# Typically 70-85% of this file's total volume, and worth it.
# On RHEL this also carries SELinux AVC denials.
# REQUIRES: auditd running + the pinned ruleset loaded, and the UF
# able to read the file (the script sets an ACL for this).

[monitor:///var/log/audit/audit.log]
disabled = false
sourcetype = linux_audit
index = linux
# Use Splunk Add-on for Linux Auditd (TA-linux_auditd) for CIM
# normalization: https://splunkbase.splunk.com/app/4232

# ── Authentication / PAM / SSH ────────────────────────────────
# RHEL equivalent of Ubuntu's auth.log.
# Contains: SSH success/fail, sudo, su, PAM, useradd, groupadd
# Maps to: T1110, T1078, T1548.003, T1136
# NOT duplicated in messages (authpriv.none). Low volume,
# extremely high value. Never cut this.

[monitor:///var/log/secure]
disabled = false
sourcetype = linux_secure
index = linux

# ── System / Daemon Messages ──────────────────────────────────
# The catch-all, minus mail, authpriv and cron. Carries kernel
# messages (there is no separate kern.log on RHEL), service
# start/stop, OOM kills, segfaults, and Sysmon for Linux output
# if it is installed.
# Note the default selector is *.info, so debug-level messages are
# not captured. That is the RHEL default and is left alone.

[monitor:///var/log/messages]
disabled = false
sourcetype = syslog
index = linux

# ── Cron ──────────────────────────────────────────────────────
# Maps to: T1053.003
# NOT duplicated in messages (cron.none) — this is the only copy.

[monitor:///var/log/cron]
disabled = false
sourcetype = syslog
index = linux


# ═════════════════════════════════════════════════════════════
#  TIER 2 - Low volume, keep unless you have a reason not to
# ═════════════════════════════════════════════════════════════

# ── Package Management ────────────────────────────────────────
# Maps to: T1072 (software deployment tools), T1195 (supply chain)
# A few KB/day even on a busy host, and the record of what changed.
#
# SOURCETYPE FIX: these were previously sourcetype = linux_audit,
# which is wrong. It mixed dnf output into auditd searches and broke
# CIM normalization, because TA-linux_auditd expects auditd records
# under that sourcetype and these are not auditd records. Now
# 'package', matching Splunk_TA_nix. Any saved search that relied on
# the old (incorrect) value needs updating.

[monitor:///var/log/dnf.log]
disabled = false
sourcetype = package
index = linux

[monitor:///var/log/dnf.rpm.log]
disabled = false
sourcetype = package
index = linux

# RHEL/CentOS 7 only. Harmless on 8/9 where the path does not exist,
# but disable it on a pure 8/9 fleet to free the TailReader slot.
[monitor:///var/log/yum.log]
disabled = false
sourcetype = package
index = linux


# ═════════════════════════════════════════════════════════════
#  DISABLED - role-specific, enable per host
# ═════════════════════════════════════════════════════════════

# ── Web Server Logs ───────────────────────────────────────────
# Maps to: T1190 (exploit public-facing app), T1133
#
# Enable ONLY on hosts actually running the service. These are by
# far the highest-volume inputs in this file: a moderately busy web
# server can produce more access-log volume than every security
# source on every other host in the fleet combined. Budget for it
# before enabling, and consider whether error_log alone carries the
# security signal you need — access_log is mostly of forensic value
# after you already know something happened.

[monitor:///var/log/httpd/access_log]
disabled = true
sourcetype = web_access
index = linux

[monitor:///var/log/httpd/error_log]
disabled = true
sourcetype = web_error
index = linux

[monitor:///var/log/nginx/access.log]
disabled = true
sourcetype = web_access
index = linux

[monitor:///var/log/nginx/error.log]
disabled = true
sourcetype = web_error
index = linux


# ═════════════════════════════════════════════════════════════
#  DISABLED - cannot work from this file
# ═════════════════════════════════════════════════════════════

# ── Scripted inputs (Splunk Add-on for Unix and Linux) ────────
# TA-nix provides: CPU, disk, interfaces, lastlog, netstat,
# passwd, time, top, update, users, version, who
# Install TA-nix: https://splunkbase.splunk.com/app/833
#
# Leave this disabled HERE. A relative script path resolves against
# the directory of the app that owns the stanza; from
# $SPLUNK_HOME/etc/system/local/ that is the system context, which
# has no bin/, and Splunk additionally refuses scripted inputs
# outside an app's bin/ or $SPLUNK_HOME/bin/scripts/. Enabling it
# here logs this on every startup and collects nothing:
#
#   ERROR FrameworkUtils - Incorrect path to script:
#     .../etc/system/local/bin/lastlog.sh. Script must be located
#     inside $SPLUNK_HOME/bin/scripts.
#   ERROR ExecProcessor - Ignoring: ".../bin/lastlog.sh"
#
# The fix is not to correct the path. Install TA-nix, which ships
# this stanza inside its own app context along with the script it
# references, and enable what you want in
# $SPLUNK_HOME/etc/apps/Splunk_TA_nix/local/inputs.conf

[script://./bin/lastlog.sh]
disabled = true
sourcetype = lastlog
index = linux
interval = 3600
