# =============================================================
# limits.conf — Splunk UF disk/queue constraints
# Prevents unbounded disk/RAM use when indexer is unreachable
#
# Deploy to:
#   Windows : %SPLUNK_HOME%\etc\system\local\limits.conf
#   Linux   : $SPLUNK_HOME/etc/system/local/limits.conf
#
# Source: Splunk documentation — queue and thruput settings
# =============================================================

[thruput]
# Max KB/s the UF will send — throttle if needed
maxKBps = 10240

[queue]
# Max in-memory queue size per pipeline
maxSize = 10MB
