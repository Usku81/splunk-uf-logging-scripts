# =============================================================
# limits.conf — Splunk UF queue/throughput constraints
#
# OPTIONAL — only deploy this file if you are experiencing
# disk or RAM pressure on endpoints running the UF (e.g. disk
# filling up or RAM spiking when the indexer is unreachable).
# Under normal conditions with a stable indexer connection
# this file is not needed.
#
# Deploy to:
#   Windows : %SPLUNK_HOME%\etc\system\local\limits.conf
#   Linux   : $SPLUNK_HOME/etc/system/local/limits.conf
#
# Restart the UF after deploying:
#   Windows : Restart-Service SplunkForwarder
#   Linux   : $SPLUNK_HOME/bin/splunk restart
# =============================================================

[thruput]
# Max KB/s the UF will send to the indexer
maxKBps = 10240

[queue]
# Cap the in-memory pipeline queue per input processor.
# Prevents RAM spiral when the indexer is temporarily unreachable.
maxSize = 10MB
