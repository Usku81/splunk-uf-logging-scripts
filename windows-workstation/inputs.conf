# =============================================================
# Splunk Universal Forwarder - inputs.conf
# Target: Windows Workstation / Member Server
# Reference: NSA EFG, ACSC WEF, Palantir WEF, CIS Benchmarks
# =============================================================

# ── Core Windows Event Logs ───────────────────────────────────

[WinEventLog://Security]
disabled = false
renderXml = true
# Only the Event IDs below are forwarded. Every ID maps to an audit
# subcategory enabled by Enable-WindowsLogging-Workstation.ps1 STEP 1 -
# keep the two files in sync when you change either one.
#
# Splunk ORs whitelist1-9 together; the grouping is purely for readability.
# Valid syntax is a comma-separated ID list or key="regex" pairs. Operators
# such as AND / OR / NOT / IN are NOT supported and cause the whole line to
# be discarded with "failed to find key in string data" in splunkd.log.
#
# The ID-list format below works with renderXml = true. The key=regex format
# does NOT - under renderXml it needs the $XmlRegex key instead. Prefer ID
# lists here for that reason.
#
# Deliberately NOT collected, measured on a Windows 11 workstation:
#   4689 process termination - 3,683/hour, ~80 MB/day, 1:1 with 4688.
#         No longer audited at all (see STEP 1); Sysmon EID 5 covers it.
#   4674 privileged object op - 2,301/hour, ~58 MB/day. Audit is now
#         Failure-only; Sysmon EID 10 is the better privilege-abuse signal.
#   5061 cryptographic op     - 2,870/hour, ~74 MB/day. Audit is now
#         Failure-only, which retains 5038 (image hash invalid).
#   4658 handle closed        - very high volume, no standalone value.
#
# 5058 (key file operation, ~92 MB/day) comes from the "Other System Events"
# subcategory, which this repo's script does NOT enable. If you see it in
# volume, it is set by your own GPO baseline - disable it there.
#
# 4670 (~300/hour, ~7 MB/day) is the only high-volume addition here. Drop it
# from whitelist6 if Security ingest needs trimming.

# Logon / session (4634 pairs with 4624 for session duration; ~5/hour)
whitelist1 = 4624,4625,4634,4648,4649,4672,4964

# Account management
whitelist2 = 4720,4722,4723,4724,4725,4726,4738,4740,4741,4742,4743,4767,4782,4793

# Group membership changes
whitelist3 = 4727,4728,4729,4730,4731,4732,4733,4734,4735,4737,4756,4757,4764

# Process execution, services, scheduled tasks
whitelist4 = 4688,4697,4698,4699,4700,4701,4702

# Credential-theft surface (SSP / auth / notification package loads)
whitelist5 = 4610,4611,4614,4622,4776

# Policy change, integrity, anti-forensics
whitelist6 = 1102,4616,4670,4719,4904,4905,4912,5038,6144,6145

# File shares and firewall rule changes
whitelist7 = 4946,4947,4948,4950,4954,5140,5142,5143,5144,5145

# Removable storage / PnP
whitelist8 = 4656,4663,6416

# RDP / NTLM session events
whitelist9 = 4778,4779

index = windows
sourcetype = XmlWinEventLog:Security

[WinEventLog://System]
disabled = false
renderXml = true
# Key Event IDs: 7034, 7036, 7040, 7045, 104
index = windows
sourcetype = XmlWinEventLog:System

[WinEventLog://Application]
disabled = false
renderXml = true
index = windows
sourcetype = XmlWinEventLog:Application

# ── Sysmon (REQUIRES Sysmon installed) ────

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = false
renderXml = true
# Event IDs: 1(ProcessCreate),3(NetworkConn),6(DriverLoad),
# 7(ImageLoad),8(CreateRemoteThread),10(ProcessAccess),
# 11(FileCreate),12-14(Registry),17-18(Pipe),19-21(WMI),
# 22(DNSQuery),25(ProcessTamper)
index = windows
sourcetype = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational

# ── PowerShell Logging (REQUIRES GPO enablement) ──────────────

[WinEventLog://Microsoft-Windows-PowerShell/Operational]
disabled = false
renderXml = true
# Event IDs: 4103 (Module Logging), 4104 (Script Block),
# 4105/4106 (Start/Stop - enable only if needed, noisy)
blacklist = 4105,4106
index = windows
sourcetype = XmlWinEventLog:Microsoft-Windows-PowerShell/Operational

[WinEventLog://Windows PowerShell]
disabled = false
renderXml = true
# Classic PS channel: EventIDs 400, 403, 600, 800
# Captures HostApplication field (base64 payloads)
index = windows
sourcetype = XmlWinEventLog:Windows-PowerShell

# ── Task Scheduler (REQUIRES enablement) ──

[WinEventLog://Microsoft-Windows-TaskScheduler/Operational]
disabled = false
renderXml = true
# Event IDs: 106 (task registered), 129 (task launched),
# 140 (updated), 141 (deleted), 200/201 (action start/end)
index = windows
sourcetype = XmlWinEventLog:Microsoft-Windows-TaskScheduler/Operational

