disabled = false

renderXml = true

index = windows

sourcetype = XmlWinEventLog:Application
 
# ── Sysmon ────────────────────────────────────────────────────

# STEP 7 installs Sysmon unless -SkipSysmon (existing installs untouched

# unless -UpdateSysmonConfig). STEP 7b grows this channel to 256 MB.

# On hosts without Sysmon, set disabled = true to avoid input errors

# in splunkd.log.
 
[WinEventLog://Microsoft-Windows-Sysmon/Operational]

disabled = false

renderXml = true

# Event IDs: 1(ProcessCreate),3(NetworkConn),5(ProcessTerminate),

# 6(DriverLoad),7(ImageLoad),8(CreateRemoteThread),10(ProcessAccess),

# 11(FileCreate),12-14(Registry),17-18(Pipe),19-21(WMI),

# 22(DNSQuery),25(ProcessTamper)

index = windows

sourcetype = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
 
# ── PowerShell Logging ────────────────────────────────────────

# STEP 4: Script Block logging (4104) always; Module logging (4103)

# unless -SkipModuleLogging. Channel grown to 256 MB.
 
[WinEventLog://Microsoft-Windows-PowerShell/Operational]

disabled = false

renderXml = true

# Event IDs: 4103 (Module Logging), 4104 (Script Block),

# 4105/4106 (Start/Stop - enable only if needed, noisy)

blacklist = 4105,4106

index = windows

sourcetype = XmlWinEventLog:Microsoft-Windows-PowerShell/Operational
 
[WinEventLog://Windows PowerShell]

disabled = false

renderXml = true

# Classic PS channel: EventIDs 400, 403, 600, 800

