# =============================================================
# Splunk Universal Forwarder - inputs.conf
# Target: Windows Domain Controller (AD DS)
# Reference: NSA EFG, ACSC WEF, Microsoft Appendix L,
# JSCU-NL logging-essentials, Palantir WEF
# NOTE: Deploy this file on DCs INSTEAD of the workstation
#       config — do NOT deploy both.
# =============================================================

# ── Core Logs (same as workstation) ──────────────────────────

[WinEventLog://Security]
disabled = false
renderXml = true
# Every ID below maps to an audit subcategory enabled by
# Enable-WindowsLogging-DC.ps1 STEP 1 - keep the two files in sync.
#
# Splunk ORs whitelist and whitelist1-9 together (10 groups max); the
# grouping is purely for readability. Valid syntax is a comma-separated
# ID list (ranges allowed, e.g. 4928-4937) or key="regex" pairs.
# AND / OR / NOT / IN are NOT supported and silently discard the line.
# ID lists work with renderXml = true; key=regex needs $XmlRegex instead.
#
# VOLUME WARNING - measure on a real DC before fleet rollout:
#   4769 Kerberos service ticket - by far the highest-volume DC event,
#        but it is the Kerberoasting signal (RC4 ticket, encryption 0x17).
#   4662 DS object access        - DCSync signal, but fires on ordinary
#        LDAP access too. If volume is unacceptable, filter to the
#        Replicating Directory Changes GUID with $XmlRegex rather than
#        dropping 4662 entirely, or you lose DCSync detection.
#   4768 Kerberos TGT            - roughly one per user logon plus renewals.
# Measure with:
#   Get-WinEvent -FilterHashtable @{LogName="Security";Id=4769;
#     StartTime=(Get-Date).AddMinutes(-10)} | Measure-Object

# Logon / session
whitelist1 = 4624,4625,4634,4648,4649,4672,4964,4778,4779

# Kerberos (DC) - 4771/4772/4773 are failures: password spray, AS-REP roast
whitelist2 = 4768,4769,4771,4772,4773,4776

# Account management (4780 AdminSDHolder, 4794 DSRM password set)
whitelist3 = 4720,4722,4723,4724,4725,4726,4738,4740,4741,4742,4743,4767,4780,4782,4793,4794

# Group membership - 4744-4764 covers distribution and universal groups
whitelist4 = 4727,4728,4729,4730,4731,4732,4733,4734,4735,4737,4744-4764

# Directory Service access and changes (DC)
whitelist5 = 4662,5136,5137,5138,5139,5141

# AD replication (DC)
whitelist6 = 4928-4937

# Process execution, services, scheduled tasks
whitelist7 = 4688,4697,4698,4699,4700,4701,4702

# Credential-theft surface, privilege abuse, policy change, integrity
# 4673/4674: the DC script audits Sensitive Privilege Use as Success+Failure
# because SeDebugPrivilege use on a DC means someone is touching lsass.
# On a workstation 4674 measured 2,301/hour (mostly lsass SeSecurityPrivilege
# noise from reading the Security log) - measure on a DC before rollout and
# drop 4673/4674 here if the volume is not justified.
whitelist8 = 1102,4610,4611,4614,4616,4622,4670,4673,4674,4719,4904,4905,4912,4985,5038,5376,5377,6144,6145

# Domain trust and AD policy change (DC)
whitelist9 = 4706,4707,4713,4716,4717,4718,4739,4864,4865,4866,4867

# Shares, firewall rules, removable storage, ADCS certificate services
whitelist = 4656,4663,4886-4898,4946,4947,4948,4950,4954,5140,5142,5143,5144,5145,6416
#
# Deliberately NOT collected (see workstation inputs.conf for measurements):
#   4689 process termination - no longer audited; Sysmon EID 5 covers it
#   4770 Kerberos TGT renewed - high volume, little detection value
#   4658 handle closed        - very high volume, no standalone value
index = windows
sourcetype = XmlWinEventLog:Security

