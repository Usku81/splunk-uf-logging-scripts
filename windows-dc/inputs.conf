# =============================================================

# Splunk Universal Forwarder - inputs.conf

# Target: Windows Workstation / Member Server

# Pairs with: Enable-WindowsLogging-Workstation-Safe.ps1

# Reference: NSA EFG, ACSC WEF, Palantir WEF, CIS Benchmarks

# Deploy as inputs.conf (deployment-server app preferred).

# Do NOT deploy together with the DC inputs.conf.

#

# Changes vs. the original workstation inputs.conf

#   - Security: + 4647 (user-initiated logoff, Logoff subcategory)

#               + 4608 (audit subsystem started)

#               + 4612 (audit queue exhausted - events LOST, alert on it)

#               + 4717, 4718 (system security access granted/removed,

#                 Authentication Policy Change - persistence via rights)

#   - Comments: 4689 / 4674 / 5061 behaviour depends on -EnforceBaseline

#     (the safe script is ADDITIVE by default and does not disable them)

#   - Sysmon / PowerShell / AppLocker comments point at the script step

#     and switch that produces the data

#   - NEW (disabled): Windows Firewall log written by STEP 6

# =============================================================
 
# ── Core Windows Event Logs ───────────────────────────────────
 
[WinEventLog://Security]

disabled = false

renderXml = true

# Only the Event IDs below are forwarded. Every ID maps to an audit

# subcategory enabled by Enable-WindowsLogging-Workstation-Safe.ps1

# STEP 1 - keep the two files in sync when you change either one.

#

# Splunk ORs whitelist and whitelist1-9 together (10 groups max); the

# grouping is purely for readability. Valid syntax is a comma-separated

# ID list or key="regex" pairs. Operators such as AND / OR / NOT / IN are

# NOT supported and cause the whole line to be discarded with

# "failed to find key in string data" in splunkd.log.

#

# The ID-list format below works with renderXml = true. The key=regex format

# does NOT - under renderXml it needs the $XmlRegex key instead. Prefer ID

# lists here for that reason.

#

# Deliberately NOT collected, measured on a Windows 11 workstation:

#   4689 process termination - 3,683/hour, ~80 MB/day, 1:1 with 4688.

#         Sysmon EID 5 covers it. The safe script turns this audit OFF only

#         with -EnforceBaseline; in default (additive) mode an existing

#         setting is kept, so the event may still be written locally.

#   4674 privileged object op - 2,301/hour, ~58 MB/day. Failure-only with

#         -EnforceBaseline; Sysmon EID 10 is the better privilege-abuse signal.

#   5061 cryptographic op     - 2,870/hour, ~74 MB/day. Failure-only with

#         -EnforceBaseline, which retains 5038 (image hash invalid).

#   4658 handle closed        - very high volume, no standalone value.

#   4800-4803 lock/unlock/screensaver (Other Logon/Logoff) - add to

#         whitelist9 if you need user presence tracking.

#

# 5058 (key file operation, ~92 MB/day) comes from the "Other System Events"

# subcategory, which this repo's script does NOT enable. If you see it in

# volume, it is set by your own GPO baseline - disable it there.

#

# 4670 (~300/hour, ~7 MB/day) is the only high-volume addition here. Drop it

# from whitelist6 if Security ingest needs trimming.

#

# On member FILE servers 5140/5145 can be high volume - measure first.
 
# Logon / session (4634/4647 pair with 4624 for session duration)

whitelist1 = 4624,4625,4634,4647,4648,4649,4672,4964
 
# Account management (local accounts on workstations / member servers)

whitelist2 = 4720,4722,4723,4724,4725,4726,4738,4740,4741,4742,4743,4767,4782,4793
 
# Group membership changes

whitelist3 = 4727,4728,4729,4730,4731,4732,4733,4734,4735,4737,4756,4757,4764
 
# Process execution (4688 incl. command line, STEP 2), services, scheduled tasks

whitelist4 = 4688,4697,4698,4699,4700,4701,4702
 
# Credential-theft surface (SSP / auth / notification package loads), NTLM validation

whitelist5 = 4610,4611,4614,4622,4776
 
# Policy change, integrity, audit pipeline health, anti-forensics

whitelist6 = 1102,4608,4612,4616,4670,4717,4718,4719,4904,4905,4912,5038,6144,6145
 
# File shares and firewall rule changes

whitelist7 = 4946,4947,4948,4950,4954,5140,5142,5143,5144,5145
 
# Removable storage / PnP

whitelist8 = 4656,4663,6416
 
# RDP reconnect / disconnect (Other Logon/Logoff)

whitelist9 = 4778,4779
 
index = windows

sourcetype = XmlWinEventLog:Security
 
[WinEventLog://System]

disabled = false

renderXml = true

# Key Event IDs: 7034, 7036, 7040, 7045, 104

index = windows

sourcetype = XmlWinEventLog:System
 
