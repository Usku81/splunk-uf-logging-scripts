# ── Windows Firewall log (optional) ───────────────────────────

# STEP 6 logs dropped + allowed packets (dropped only with -DroppedOnly)

# to pfirewall.log, max 32 MB. Allowed-connection logging is high volume

# on servers - enable this input deliberately. Sourcetype name is local;

# add field extractions (W3C header: date time action protocol src-ip ...).
 
[monitor://C:\Windows\System32\LogFiles\Firewall\pfirewall.log]

disabled = true

sourcetype = windows:firewall:log

index = windows

followTail = false
 
